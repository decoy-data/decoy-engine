# Jobs that must be green on a pull request head before it merges. The lane sentry
# (tests/sentry/tooling/test_ci_lanes.py) checks every entry against the workflows. The nightly
# tier is not listed: it is every job that runs on `schedule`, derived from the workflows.
schema = 1

[[merge]]
workflow = "ci.yml"
jobs = [
  "packaging-gate",
  "ml-gate",
  "base-install",
  "ner-gate",
  "dp-certified-gate",
  "determinism",
  "pg-gate",
  "duckdb2-gate",
  "import-smoke",
  "faker-output-lock",
]

[[merge]]
workflow = "native-companion.yml"
jobs = [
  "companion-wheel-linux",
  "companion-wheel-windows",
  "native-changes",
  "companion-wheel-macos-ok",
  "companion-rust-lint",
  "core-companion-present",
  "companion-fuzz-sanitizer",
  "core-companion-absent",
]

[[merge]]
workflow = "docs.yml"
jobs = ["build"]

[[merge]]
workflow = "compat-preflight.yml"
jobs = ["compat-preflight"]

[[merge]]
workflow = "changelog-fragment.yml"
jobs = ["changelog-fragment"]

[[merge_exempt]]
workflow = "regression-proof.yml"
job = "prove-regression"
reason = "runs only on PRs labelled bugfix"

[[merge_exempt]]
workflow = "docs.yml"
job = "deploy"
reason = "deploy job; runs only from a main push, and docs.yml has no push trigger until DOCS_DEPLOY is enabled"

[[merge_exempt]]
workflow = "native-companion.yml"
job = "companion-wheel-macos"
reason = "path-scoped; judged by companion-wheel-macos-ok"

# A merge job that judges exempt jobs. It may carry exactly `if: always()` and may need the jobs it
# judges; its step must run scripts/dev/native_scope.py judge on toJSON(needs). Branch protection
# requires the aggregator's one context instead of the judged job's per-leg contexts.
[[aggregator]]
workflow = "native-companion.yml"
job = "companion-wheel-macos-ok"
judges = ["companion-wheel-macos"]
reason = "macOS legs run only when the PR touches the native companion; a skipped leg reports no per-leg check"

# Commit-status contexts a head needs before it merges. The status is posted by a gate-selfhosted.yml
# dispatch on that sha (job gate-verdict). A status, not a check run: a skipped job's check run
# passes branch protection, a missing status does not.
[[merge_status]]
context = "engine-gate/verdict"
reason = "the self-hosted gate ran on this exact head and passed"

# Default markers whose tests skip outside their profile: a whole-suite run does not count as
# their lane.
[[dedicated_marker]]
name = "ml"
reason = "tests skip when the ML stack cannot load (tests/_ml.py); only ml-gate sets DECOY_REQUIRE_ML=1 so that fails"

[[dedicated_marker]]
name = "ner"
reason = "tests need the NER model wheel; the dev profile skips them"

[[dedicated_marker]]
name = "dp_certified"
reason = "fit_dp_snapshot completes only on the certified profile"

[[dedicated_marker]]
name = "pg_integration"
reason = "tests need a Postgres server and the DuckDB postgres extension; only pg-gate sets DECOY_REQUIRE_PG=1 so a missing one fails"
