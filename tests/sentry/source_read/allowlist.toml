# Sites the source-read guard (test_boundary.py) accepts outside the conversion choke point.
# The count was measured on origin/main 4bc582d0a, before S1b-1 routed its own sites; S1b-1 routes
# its sites through `arrow_to_frame` and does not add them here. It may only go down: lowering it
# means removing the site and editing `ratchet_count` in the same diff.
base_sha = "4bc582d0a"
ratchet_count = 7

